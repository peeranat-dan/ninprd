name: E2E

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

# Read-only: the job only checks out code and uploads artifacts.
permissions:
    contents: read

concurrency:
    group: e2e-${{ github.ref }}
    cancel-in-progress: true

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
              with:
                  # turbo --affected compares against the PR base branch.
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version-file: ".nvmrc"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Chromium
              run: pnpm test:e2e:install

            # PRs only test apps affected by the change; main tests everything.
            - name: Run E2E tests
              run: pnpm test:e2e ${{ github.event_name == 'pull_request' && '--affected' || '' }}

            - name: Upload reports
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-reports
                  path: e2e/*/playwright-report
                  retention-days: 7
