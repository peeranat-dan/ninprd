name: Screenshot projects

on:
  push:
    branches: [main]
    paths:
      # Refresh screenshots when the landing app changes, but ignore the
      # generated assets themselves so the bot commit does not retrigger this.
      - 'apps/landing/**'
      - '!apps/landing/src/projects/assets/**'
  workflow_dispatch:

# Needed by create-pull-request to push the branch and open/update the PR.
permissions:
  contents: write
  pull-requests: write

# One run at a time; newer pushes cancel an in-flight run.
concurrency:
  group: screenshot-projects
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter landing exec playwright install --with-deps chromium

      - name: Capture screenshots
        run: pnpm --filter landing run screenshot

      - name: Open pull request with refreshed screenshots
        uses: peter-evans/create-pull-request@v7
        with:
          # Only the generated assets should be part of the PR.
          add-paths: apps/landing/src/projects/assets
          branch: chore/refresh-project-screenshots
          delete-branch: true
          commit-message: 'chore(landing): refresh project screenshots'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          title: 'chore(landing): refresh project screenshots'
          body: |
            Automated refresh of project screenshots for the landing page.

            Captured by `apps/landing/scripts/screenshot-projects.mjs`.
            Review the image diff before merging.
          labels: automated
